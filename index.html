
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDEN | AI Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <header>
            <h1>EDEN</h1>
            <p>Empowering Discernment through Excellence and Nurture</p>
            <span class="status">● SYSTEM ONLINE</span>
        </header>

        <section class="welcome">
            <h2>Good day.</h2>
            <p>I am EDEN, your personal AI assistant.</p>
            <p>How may I assist you today?</p>
        </section>

        <section class="chat">
            <div class="message">
                <strong>EDEN:</strong>
                Welcome. My systems are ready.
            </div>

            <input type="text" id="userInput"
                placeholder="Message EDEN...">

            <button onclick="sendMessage()">Send</button>
        </section>

        <footer>
            <p>EDEN v0.1 | Prototype</p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
